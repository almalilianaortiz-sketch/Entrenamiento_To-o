name: App checks
on: [push, pull_request]
jobs:
  functional-and-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
